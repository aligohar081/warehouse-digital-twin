# Policy-as-code example — copy to policies.yaml at the project root to
# override the built-in defaults in backend/models.py without touching
# Python. Loaded once at process start (backend/models.py, bottom of the
# file) and can be reloaded live with:
#
#     curl -X POST http://127.0.0.1:5000/api/policies/reload
#
# See GET /api/policies for the values actually in effect right now.
# Every key below is optional — omit anything you don't want to override.
#
# The values below ARE the built-in defaults, so copying this file as it
# is changes nothing: edit only what you want to change. Two things to
# know before you do:
#   - Under `config:` only keys backend/models.py's CONFIG already has take
#     effect; a misspelt key is silently ignored.
#   - certification_requirements, robot_classes and operator_roles each
#     REPLACE the whole built-in table (apply_policy in backend/policy.py),
#     so a custom table must keep every entry it still needs.

config:
  BATTERY_LOW: 20
  BATTERY_CRITICAL: 8
  # Turn on live LLM narration for AGENT_REPLAN / AGENT_AUDIT — needs a
  # Groq API key too (env var GROQ_API_KEY, or evals/.env). See
  # backend/llm.py. Off by default: a live model call is a narration
  # layer over real computed data, never a hard dependency.
  AGENT_LLM_ENABLED: false
  MAINTENANCE_DISTANCE_THRESHOLD: 150
  MAINTENANCE_CHARGE_CYCLES_THRESHOLD: 5
  # 0.0-1.0 — chance a robot fails to avoid another robot it would
  # otherwise wait/replan/sidestep around, simulating imperfect
  # real-time sensing. 0.0 (default) = the traffic system's avoidance is
  # perfect, collisions never happen on their own. Try 0.1-0.3 to
  # actually see robots collide with each other while working — see
  # backend/simulator.py::_act_navigate and DigitalTwin.register_collision.
  COLLISION_RISK: 0.0
  # 0.0-1.0 — chance a completed delivery's payload silently fails to
  # actually seat at the destination: no sensor catches it, so the
  # robot, the event trail (BOX_DELIVERED, TASK_COMPLETED) and the task
  # lifecycle all still report a clean success. 0.0 (default) = every
  # completed delivery really landed the box where it belongs. Try
  # 0.1-0.3 to see the system confidently report success on a task that
  # didn't actually happen — only caught after the fact by
  # eval_engine.check_state_transition (python -m backend.run_evals,
  # GET /api/tasks/{id}/eval, or the promptfoo suite in evals/), never
  # by anything in the live event trail — see
  # backend/simulator.py::_act_deliver.
  FALSE_SUCCESS_RISK: 0.0
  # Injected faults on the distribution-centre floor (backend/faults.py),
  # each 0.0-1.0, the chance per opportunity, and off by default. Each
  # does its damage silently and is caught after the fact (TRUST_LAYER.md
  # says by what). For a single occurrence on demand, use
  # POST /api/faults/<kind> or the dashboard's Shift panel (Inject fault).
  SCAN_MISCOUNT_RISK: 0.0        # a drone's count reports the true number +/- 1-3 (count_consistent)
  WRONG_LEVEL_RISK: 0.0          # a forklift places a pallet a level up or down but reports the requested one (placement_level_correct)
  GRASP_FAIL_RISK: 0.0           # an arm or the picker misses a grasp; retried up to twice, a third miss fails the job
  CONVEYOR_JAM_RISK: 0.0         # a conveyor cell jams as an item moves on (CONVEYOR_JAMMED, then a CLEAR_JAM job)
  HANDOFF_LOSS_RISK: 0.0         # an item put onto the conveyor never arrives, though the giver reports it placed (handoff_consistent)
  MIS_SORT_RISK: 0.0             # the sorter drops a carton on the wrong dock (sort_correct)
  MISDECLARED_WEIGHT_RISK: 0.0   # an inbound pallet really weighs 1.1-1.6x what it declares (payload_within_limit)

approved_firmware_versions:
  - "2.1.0"
  - "2.1.1"
  - "2.2.0"

approved_agent_models:
  - "groq/gpt-oss-20b"
  - "groq/gpt-oss-120b"

# IMPORTANT: apply_policy REPLACES the whole built-in table with this one,
# so a custom table must keep every entry it still needs. Leave CLEAR_JAM
# out and a person clearing a jam inside a fenced pack cell needs no
# robot_cell_access at all: anyone on shift, Riley included, could be sent in.
certification_requirements:
  HUMAN_INSPECTION: safety_inspection
  MIXED_MAINTENANCE_MISSION: electrical_safety
  OPERATOR_APPROVAL: safety_inspection
  OPERATOR_MAINTENANCE_SIGNOFF: electrical_safety
  CLEAR_JAM: robot_cell_access   # inside a pack cell only; scoped to the arm's model

# in ERROR (see Simulator._auto_charge / DigitalTwin.request_charge).
# A custom roster must also include ARM and HUMANOID: the
# distribution-centre floor's seed creates both, and an unknown class
# stops it ("Unknown robot_class 'ARM'"), so the app won't start on that
# floor. Keep each class's distribution-centre job types too (UNLOAD_TRUCK,
# PATROL, PACK_ORDER, ...), or the gate refuses those jobs.
robot_classes:
  AMR:
    label: "AMR (general purpose)"
    speed: 2.0
    allowed_task_types: null
  FORKLIFT:
    label: "Forklift (heavy handling)"
    speed: 1.2
    allowed_task_types:
      - PICK_AND_DELIVER
      - PICK_BOX
      - DELIVER_BOX
      - MOVE_BOX
      - MOVE_ROBOT
      - CHARGE_ROBOT
      - UNLOAD_TRUCK
      - PUTAWAY_PALLET
      - RETRIEVE_PALLET
      - LOAD_TRUCK
  SCOUT:
    label: "Scout (inspection only)"
    speed: 3.0
    allowed_task_types:
      - MOVE_ROBOT
      - MIXED_MAINTENANCE_MISSION
      - CHARGE_ROBOT
      - PATROL
  HEAVY_HAULER:
    label: "Heavy Hauler (slow, high-capacity)"
    speed: 0.8
    allowed_task_types:
      - PICK_AND_DELIVER
      - PICK_BOX
      - DELIVER_BOX
      - MOVE_BOX
      - MOVE_ROBOT
      - CHARGE_ROBOT
      - BATCH_DELIVER
      - UNLOAD_TRUCK
  DRONE:
    label: "Drone (fast, aerial/overhead)"
    speed: 4.0
    allowed_task_types:
      - MOVE_ROBOT
      - MIXED_MAINTENANCE_MISSION
      - CHARGE_ROBOT
      - CYCLE_COUNT
  PICKER:
    label: "Picker (fast, pick & deliver only)"
    speed: 2.5
    allowed_task_types:
      - PICK_AND_DELIVER
      - PICK_BOX
      - DELIVER_BOX
      - MOVE_BOX
      - CHARGE_ROBOT
      - PICK_ITEMS
  # The distribution centre's fixed pack-cell arms: mains-powered, so
  # CHARGE_ROBOT never actually runs, but the rule above still applies.
  ARM:
    label: "Arm (fixed pack cell)"
    speed: 0.7
    allowed_task_types:
      - CHARGE_ROBOT
      - PACK_ORDER
  # The distribution centre's humanoid: it works only while a supervisor
  # with humanoid_supervision is near (Jordan on the seeded floor).
  HUMANOID:
    label: "Humanoid (supervised, general purpose)"
    speed: 0.8
    allowed_task_types:
      - PICK_AND_DELIVER
      - PICK_BOX
      - DELIVER_BOX
      - MOVE_BOX
      - MOVE_ROBOT
      - CHARGE_ROBOT
      - TOTE_TO_STATION
      - RETURN_TOTE
      - RETURNS_PUTAWAY

# Same "replaces the whole roster if present" rule as robot_classes above.
# No equivalent hard requirement here (there's nothing an operator role
# can omit that strands them the way skipping CHARGE_ROBOT does for a
# robot) — certifications/shift hours are just defaults, always
# overridable per operator afterwards.
operator_roles:
  SAFETY_INSPECTOR:
    label: "Safety Inspector"
    certifications: [safety_inspection]
    shift_start_hour: 9
    shift_end_hour: 17
  MAINTENANCE_TECH:
    label: "Maintenance Technician"
    certifications: [electrical_safety, equipment_maintenance]
    shift_start_hour: 9
    shift_end_hour: 17
  SENIOR_OPERATOR:
    label: "Senior Operator / Shift Lead"
    certifications:
      - safety_inspection
      - electrical_safety
      - equipment_maintenance
      - heavy_equipment
      - hazmat_handling
      - quality_control
    shift_start_hour: null   # always available
    shift_end_hour: null
  NIGHT_SHIFT:
    label: "Night-Shift Operator"
    certifications: [safety_inspection]
    shift_start_hour: 22     # wraps past midnight
    shift_end_hour: 6
  REMOTE_ONCALL:
    label: "Remote / On-call Operator"
    certifications: [safety_inspection, electrical_safety]
    shift_start_hour: null
    shift_end_hour: null
  TRAINEE:
    label: "Trainee / Probationary Operator"
    certifications: []       # deliberately none yet
    shift_start_hour: 9
    shift_end_hour: 17
